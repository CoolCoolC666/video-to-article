# ---------------------------------------------------------------
# 用途：funasr-hotword / Qwen3-ASR context_file 的来源
# 流程：build_context.py 读这个文件 → fetch → LLM 抽取 → 写 contexts/limbus_company.txt
# 验证状态：verified=已 web_search 核实存在 / placeholder=占位（待用户确认）/ removed=已废弃
# 信任度：0.0-1.0，越高越优先；低于 0.6 建议人工 review
