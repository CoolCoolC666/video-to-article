context_generation:
  enabled: false  # 设为 true 后 build_context.py 才会处理这个 yaml
  min_terms: 30   # 至少 30 个专名才生成 contexts/limbus_company.txt，避免空词表
  max_terms: 500
  format: "Qwen3-ASR context 格式（每行 '主词 别名1 别名2 ...'）"

