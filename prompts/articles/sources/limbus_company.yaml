game: limbus_company
version: "v1 骨架（2026-09-12 占位，待用户补充 + web_search 验证）"
last_updated: 2026-09-12
last_verification: 2026-09-12-placeholder
target_context: contexts/limbus_company.txt

extraction:
  model: "MiniMax-M3"  # 跟 YilanChengWen 同款
  prompt_template: |
    从以下网页内容里，提取 Limbus Company（韩国 Project Moon 开发）的**专有名词**：
    - 罪人 / Sinner 角色名（含外号、昵称、#编号 0-11）
    - 12 经理人名（罗佳 / 食指 / 默尔索 / 良秀 / 奥赛罗 / 浮士德 等）
    - EGO 名（含 EGO 等级 / 罪孽类型 / 武器类型）
    - 副本 / 关卡（镜中地牢 / 故事章节 / 抽象 / 异常事件 / 人格升华）
    - 状态 / 机制词（灼伤 / 流血 / 震颤 / 腐蚀 / 呼吸 / 罪孽 / 异常状态 / 战斗机制）
    - 项目用词（"肉 / 骨 / 血 / 头"等 Limbus 风格代词 / "笼中鸟" / "辛克莱" 等社区高频词）
    - Project Moon 跨作品引用角色（萝瑞塔 / Faust / 塞尼 来自 Library of Ruina；艾因 / 主管 来自 Lobotomy Corporation）

    输出 JSON 列表，每项 { term: "标准词", aliases: ["别名1", "别名2"], category: "sinners|managers|egos|stages|status_mechanics|project_moon|misc", confidence: 0-1 }
    只输出 JSON，不要解释。
  output_format: "json_array"
  min_confidence: 0.5

